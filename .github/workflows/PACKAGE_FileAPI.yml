# Workflow to package up the File API project
name: Build pyproject - File API
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}
on:
  workflow_call:
    inputs:
      with_caching:
        type: boolean
        description: "Whether to cache the build for upload in a later job."
        required: true
      build_name:
        type: string
        description: "Name of artifact to store package for sharing to other workflows, if caching is used."
        required: false
        default: "key"

jobs:

  build_package:
    name: Build Python Package
    runs-on: ubuntu-24.04
    container: ${{ vars.PACKAGING_CONTAINER }}
    defaults:
      run:
        shell: sh
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-package
      cancel-in-progress: true

    steps:

    # 1. Local checkout & config
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Get Dependencies
      run: python -m pip install -r requirements.txt
    - name: Get Build Dependencies
      run: python -m pip install -r requirements-build.txt
    - name: Mark Repo Trusted
      run: git config --global --add safe.directory '/__w/*'

    # 2. Build 
    - name: Build Package
      run: python -m build

    # 3. Cache for use by others
    - name: Cache Build for Publishing
      if: inputs.with_caching == true
      id: cache-build
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.build_name }}
        path: ./dist/
    - name: Non-Cached Build
      if: inputs.with_caching != true
      run: echo "No build cached"
