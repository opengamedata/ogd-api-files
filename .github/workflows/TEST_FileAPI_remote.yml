# Workflow to test Files API on the CI server
name: Remote Testbed - FileAPI
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}
on:
  workflow_dispatch:
    inputs:
      base_url:
        type: string
        description: "The base URL of the deploy to test."
        required: true
  workflow_call:
    inputs:
      base_url:
        type: string
        description: "The base URL of the deploy to test."
        required: true

env:
  LOCAL_TEST_DIR: ./tests/cases/apis/resources/**/RemoteCase.py

jobs:
  check_deploy:
    name: Check for Existing Deploy
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-file
      cancel-in-progress: false

    steps:

    - name: cURL Check Hello Endpoint
      run: curl -Is --fail-with-body https://${{ inputs.base_url }}/hello

  # deploy_if_needed:
  #   name: FileAPI Deploy (If Needed)
  #   needs: check_deploy
  #   if: failure()
  #   uses: ./.github/workflows/DEPLOY_FileAPI.yml
  #   secrets: inherit
  #   with:
  #     deploy_host: ${{ vars.OGD_STAGING_HOST }}
  #     branch: ${{ github.ref_name }}
  #     remove: false

  run_testbed_files:
    name: Run FileAPI Testbed
    needs: [check_deploy]
    if: always() && (needs.check_deploy.result == 'success' || needs.deploy_if_needed.result == 'success')
    runs-on: ubuntu-24.04
    container: python:${{ vars.OGD_PYTHON_VERSION }}-alpine
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-file
      cancel-in-progress: false
    defaults:
      run:
        shell: sh

    steps:

    - name: Announce testing
      run: echo "Testing HelloAPI endpoint at ${{ case(github.event_name == 'workflow_call', inputs.base_url, env.DEFAULT_URL) }}"

  # 1. Local checkout 
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Get Dependencies
      run: python -m pip install -r requirements.txt
    - name: Get current version tag
      id: version-tag
      run: |
        echo "VERSION_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
        echo "SRC_REVISION=$(git rev-list -1 HEAD -- src/)" >> $GITHUB_OUTPUT
    - name: Set up Config File
      uses: ./.github/actions/test_config
      with:
          endpoint: inputs.base_url
          api_version: ${{ steps.version-tag.outputs.VERSION_TAG }}-${{ github.ref_name }}-${{ steps.version-tag.outputs.SRC_REVISION }}
          verbose_output: "True"
          shell: sh

  # 2. Build & configure remote environments

  # 3. Perform export
    - name: Execute testbed
      run: python -m unittest ${{ env.LOCAL_TEST_DIR }} 

  # 4. Cleanup & complete
    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        path: ./*.log
