# Workflow to test building the File API project
name: Build pyproject - File API
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}
on:
  workflow_call:
    inputs:
      image_name:
        type: string
        description: "The name of the image."
        required: true
      image_tag:
        type: string
        description: "The image tag to use."
        required: true
      with_caching:
        type: boolean
        description: "Whether to cache the build for upload in a later job."
        required: true
        default: false
    secrets:
      image_repository:
        required: True
        description: "Secret indicating the repository of Docker images to use to find the image for deploy."

jobs:

  build_package:
    name: Build Python Package
    runs-on: ubuntu-24.04
    container: python:${{ vars.OGD_PYTHON_VERSION }}-alpine
    defaults:
      run:
        shell: sh
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-package
      cancel-in-progress: true

    steps:

    # 1. Local checkout & config
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
    - name: Get Dependencies
      run: python -m pip install -r requirements.txt
    - name: Get Build Dependencies
      run: python -m pip install -r requirements-build.txt

    # 2. Build 
    - name: Build Package
      run: python -m build

    # 3. Cache for use by others
    - name: Cache Build for Publishing
      if: inputs.with_caching == true
      id: cache-build
      uses: actions/cache/save@v6.1.0
      with:
        key: opengamedata-api-files-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist/
    - name: Non-Cached Build
      if: inputs.with_caching != true
      run: echo "No build cached"

  build_image:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-image
      cancel-in-progress: true

    steps:

    # 1. Local checkout & config
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Get current version tag
      id: version-tag
      run: |
        echo "VERSION_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
    - name: Set up Config File
      uses: ./.github/actions/FileAPI_config
      with:
        api_version: ${{ steps.version-tag.outputs.VERSION_TAG }}-${{ github.ref_name }}-${{ github.sha }}

    # 2. Build image

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push to GHCR
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: "${{ secrets.image_repository }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
        cache-from: type=gha
        cache-to: type=gha,mode=max
