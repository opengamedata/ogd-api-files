# Workflow to test building the File API project
name: Build pyproject - File API
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}
on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        description: "The image tag to use."
        required: false
        default: "untagged"
    outputs:
      image_name:
        description: "The full name of the image that was built and uploaded to a repository."
        value: ${{ jobs.build_image.outputs.image_name }}
    secrets:
      image_repository:
        required: True
        description: "Secret indicating the repository of Docker images to use to find the image for deploy."

jobs:

  build_image:
    name: Build Docker Image
    runs-on: ubuntu-24.04
    outputs:
      image-name: ${{ steps.get_image_name.outputs.image_name }}
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-image
      cancel-in-progress: true

    steps:

    # 1. Local checkout & config
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Get current version tag
      id: version_tag
      run: |
        echo "VERSION_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
    - name: Set up Config File
      uses: ./.github/actions/FileAPI_config
      with:
        api_version: ${{ steps.version_tag.outputs.VERSION_TAG }}-${{ github.ref_name }}-${{ github.sha }}

    # 2. Build image

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get Image Name
      id: get_image_name
      run: echo "image_name=${{ github.repository }}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

    - name: Build and Push to Repository
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        push: true
        tags: "${{ secrets.image_repository }}/${{ steps.get_image_name.outputs.image_name }}"
        cache-from: type=gha
        cache-to: type=gha,mode=max
