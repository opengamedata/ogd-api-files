# Workflow to physically deploy Files API to the CI server
name: Deploy Script - FileAPI
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}
on:
  workflow_call:
    inputs:
      deploy_host:
        type: string
        description: "The host on which to deploy."
        required: true
        default: ${{ vars.OGD_STAGING_HOST }}
      branch:
        type: string
        description: "The specific branch to deploy to/from. This is used because workflow dispatches appear to default to main branch."
        required: true
      remove:
        type: boolean
        description: "Whether to remove the deploy for the current branch."
        required: true
        default: false
      as_latest:
        type: boolean
        description: "Whether to also deploy/remove as the 'latest' version of API"
        required: false
        default: false

env:
  REPOSITORY: ${{ secrets.DOCKER_IMAGE_REPO }}
  IMAGE_NAME: ${{ github.repository }}/${{ inputs.branch }}:latest

jobs:
  build_image:
    name: Build Docker Image for Deploy
    if: inputs.remove == false
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-deploy
      cancel-in-progress: true

    steps:

    # 1. Local checkout & config
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get current version tag
      id: version-tag
      run: |
        echo "VERSION_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
    - name: Set up Config File
      uses: ./.github/actions/FileAPI_config
      with:
          remote_app_path: ${{ env.DEPLOY_DIR }}
          api_version:     ${{ steps.version-tag.outputs.VERSION_TAG }}-${{ github.ref_name }}-${{ github.sha }}

    # 2. Build image

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push to GHCR
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy_fileapi:
    name: Deploy File API to Google Cloud
    if: inputs.remove == false
    needs: build_image
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-deploy
      cancel-in-progress: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 3. Deploy image

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ secrets.GCLOUD_PROJECT_ID }}
        workload_identity_provider: 'projects/${{ secrets.GCLOUD_PROJECT_ID }}/locations/global/workloadIdentityPools/${{ secrets.GCLOUD_ID_POOL }}/providers/${{ secrets.GCLOUD_ID_ }}'
        service_account: ${{ secrets.GCLOUD_DEPLOY_USER }}

    - id: 'deploy'
      uses: 'google-github-actions/deploy-cloudrun@v3'
      with:
        service: 'ogd-file-api-cloud'
        image: '${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}'

    # 4. Cleanup & complete

  branch_delete:
    name: Remove FileAPI Deploy
    if: inputs.remove == true
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
      cancel-in-progress: false
    
    steps:
    
    # 3. Remote config & clean
    - name: Remove Image from Repo
      uses: dataaxiom/ghcr-cleanup-action@v1
      with:
        delete-tags: ${{ env.IMAGE_NAME }}

    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      with:
        path: ./*.log
