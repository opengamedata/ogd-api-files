# Workflow to physically deploy Files API to the CI server
name: Deploy Script - FileAPI
run-name: ${{ format('{0} - {1}', github.workflow, github.event_name == 'push' && github.event.head_commit.message || 'Manual Run') }}
on:
  workflow_call:
    inputs:
      deploy_host:
        type: string
        description: "The host on which to deploy."
        required: true
        default: ${{ vars.OGD_STAGING_HOST }}
      branch:
        type: string
        description: "The specific branch to deploy to/from. This is used because workflow dispatches appear to default to main branch."
        required: true
      remove:
        type: boolean
        description: "Whether to remove the deploy for the current branch."
        required: true
        default: false
      as_latest:
        type: boolean
        description: "Whether to also deploy/remove as the 'latest' version of API"
        required: false
        default: false

env:
  DEPLOY_HOST: ${{ inputs.deploy_host }}
  DEPLOY_DIR:                            ${{ vars.API_BASE_PATH }}/files/${{ inputs.branch }}
  DEPLOY_URL:  ${{ inputs.deploy_host }}/${{ vars.API_BASE_URL  }}/files/${{ inputs.branch }}/app.wsgi
  DEPLOY_DIR_LATEST:                     ${{ vars.API_BASE_PATH }}/files/latest
  IMAGE_NAME: ${{ github.repository }}/${{ inputs.branch }}:latest
  REPOSITORY: ghcr.io/opengamedata

jobs:
  build_image:
    name: Build Docker Image for Deploy
    if: inputs.remove == false
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-deploy
      cancel-in-progress: true

    steps:

    # 1. Local checkout & config
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get current version tag
      id: version-tag
      run: |
        echo "VERSION_TAG=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
    - name: Set up Config File
      uses: ./.github/actions/FileAPI_config
      with:
          remote_app_path: ${{ env.DEPLOY_DIR }}
          api_version:     ${{ steps.version-tag.outputs.VERSION_TAG }}-${{ github.ref_name }}-${{ github.sha }}

    # 2. Build image

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push to GHCR
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy_fileapi:
    name: Deploy File API to Google Cloud
    if: inputs.remove == false
    needs: build_image
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-deploy
      cancel-in-progress: true
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 3. Deploy image

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        project_id: 'wcer-field-day-ogd'
        workload_identity_provider: 'projects/wcer-field-day-ogd/locations/global/workloadIdentityPools/ogd-github-pool/providers/ogd-github-openid-connect'
        service_account: 'github-docker-image-creator@wcer-field-day-ogd-1798.iam.gserviceaccount.com'

    - id: 'deploy'
      uses: 'google-github-actions/deploy-cloudrun@v3'
      with:
        service: 'ogd-file-api-cloud'
        image: '${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}'

    # 4. Cleanup & complete

  branch_delete:
    name: Remove FileAPI Deploy
    if: inputs.remove == true
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
      cancel-in-progress: false
    
    steps:
    
    - name: Announce cleanup
      run: echo "Removing branch deploy at ${{ env.DEPLOY_URL }}"

    # 1. Local checkout & config
    
    # 2. Build 

    # 3. Remote config & clean
    - name: Connect to VPN
      uses: opengamedata/actions-openconnect-vpn@v1.1
      with:
        username: ${{ secrets.VPN_USER }}
        password: ${{ secrets.VPN_PASS }}
        endpoint: "soe.vpn.wisc.edu"

    - name: Setup Access Key
      run: |
        mkdir -p ~/.ssh
        echo '${{secrets.CLEAN_KEY}}' >> ./key.txt
        chmod 600 ./key.txt

    - name: Remove branch folder
      run: ssh -o StrictHostKeyChecking=no -T -i ./key.txt ${{ secrets.CLEAN_USER }}@${{ env.DEPLOY_HOST }} "rm -r ${{ env.DEPLOY_DIR }}"
    # This allows us to yank down a recent release, if needed. Generally don't intend to do this.
    - name: Remove 'latest' folder
      if: ${{ inputs.as_latest }}
      run: ssh -o StrictHostKeyChecking=no -T -i ./key.txt ${{ secrets.CLEAN_USER }}@${{ env.DEPLOY_HOST }} "rm -r ${{ env.DEPLOY_DIR_LATEST }}"

    - name: Upload logs as artifacts
      uses: actions/upload-artifact@v4
      with:
        path: ./*.log