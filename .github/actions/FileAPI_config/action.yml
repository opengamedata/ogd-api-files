name: "Configure app.wsgi file for a deploy"
author: Luke Swanson
description: "Given a set of appropriate inputs, this action prepares the app.wsgi file for an API deploy."
branding:
  icon: 'clipboard'
  color: 'blue'
inputs:
  api_version:
    description: "The version of the API code."
    required: false
    default: 'Testing'
  local_app_path:
    description: "Local path to the folder containing the WSGI app to be deployed"
    required: true
    default: 'src'
  config_path:
    description: "Local path to config folder"
    required: false
    default: 'config'
  shell:
    description: "The shell to use to execute the steps"
    required: false
    default: bash
runs:
  using: "composite"
  steps:
    - name: Set up src/config
      run: cp ${{ inputs.config_path }}/config.py.template ${{ inputs.config_path }}/config.py 
      shell: ${{ inputs.shell }}
    - name: Set to Non-Local Deploy
      run: sed -i 's@"LOCAL"\s*:\s*True@"LOCAL":False@g' ${{ inputs.config_path }}/config.py
      shell: ${{ inputs.shell }}
    - name: Set API Version
      run: sed -i 's@VERSION_PLACEHOLDER@${{inputs.api_version}}@g'  ${{ inputs.config_path }}/config.py
      shell: ${{ inputs.shell }}
